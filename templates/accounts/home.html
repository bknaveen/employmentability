{% extends 'base/auth_base.html' %}


{% block content %}
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }

    .iframe-container {
        position: relative;
        width: 100%;
        height: 100%;
    }

    iframe {
        border: none;
        width: 100%;
        height: 100%;
    }

    .login-button {
        position: absolute;
        top: 35px;
        right: 20px;
        z-index: 1000;
    }

    .btn {
        background-color: #0d6efd;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
    }

    .btn i {
        margin-right: 5px;
    }
</style>
<div class="iframe-container">
    {% if user.is_authenticated %}
    <a href="{% url 'logout' %}" class="btn login-button">Logout</a>
    {% else %}
    <a href="{% url 'login' %}" class="login-button btn">
        <i class="bx bxs-lock-open"></i>Sign in
    </a>
    <a href="{% url 'login' %}" class="login-button btn">
        <i class="bx bxs-lock-open"></i>Sign in
    </a>
    {% endif %}

    <iframe src="https://employability.online/" allowfullscreen></iframe>
</div>


{% endblock %}
