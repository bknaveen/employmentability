<!doctype html>
{% load static %}
<html lang="en" class="semi-dark">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!--favicon-->
	<link rel="icon" href="{% static 'assets/admin/images/favicon-32x32.png' %}" type="image/png" />

	<!-- loader-->
	<link href="{% static 'assets/admin/css/pace.min.css' %}" rel="stylesheet" />
